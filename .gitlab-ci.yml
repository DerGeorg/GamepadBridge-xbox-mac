# =============================================================================
# GamepadBridge — release pipeline
#
# The build is not here and cannot be: code signing needs the Developer ID in
# Georg's keychain, and notarization and Sparkle's EdDSA key live there too.
# None of that runs on the Linux runners (gitlab-devops skill,
# references/mac-builds.md). So `scripts/release.sh --publish` builds on the
# Mac and pushes a *pending* release; this pipeline takes it from there:
#
#   release:verify    automatic   checks everything, publishes nothing
#   release:publish   one click   GitLab release + tag, appcast, Homebrew tap
#
# GitHub follows by itself: the push mirror carries the tag, and
# .github/workflows/mirror-release.yml mirrors the release.
#
# This deviates from the house pattern of pipelines built only from
# ci/components; CLAUDE.md says why.
# =============================================================================

stages: [verify, publish]

default:
  image: alpine:3.22
  before_script:
    - apk add --no-cache bash curl python3 openssl > /dev/null

workflow:
  rules:
    # The tag release:publish creates must not start a pipeline of its own.
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

release:verify:
  stage: verify
  script:
    - scripts/verify-release.sh
  rules:
    # Only a release commit carries this file. Any other push to main has no
    # jobs and therefore produces no pipeline at all.
    - exists: [packaging/pending-release.json]

release:publish:
  stage: publish
  needs: [release:verify]
  script:
    - scripts/publish-release.sh
  environment:
    name: production
    url: https://gitlab.dergeorg.at/mac/gamepadbridge/-/releases
  rules:
    # Publishing reaches every installed copy at once, so it waits for a
    # click — the same rule as deploy:prod everywhere else.
    - exists: [packaging/pending-release.json]
      when: manual
  # Without this a manual job counts as optional and the pipeline shows
  # "passed" while the release is still unpublished.
  allow_failure: false
